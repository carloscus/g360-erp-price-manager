[project]
name = "g360-erp-price-list"
version = "1.1.0"
description = "G360 ERP Price List - Gestor de listas de precios con descuentos en cascada (CIPSA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=0.23.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.2.2",
    "g360-core",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter (reemplaza flake8 + isort + black).
# Misma configuración que usa g360-core para consistencia en el ecosistema.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ---------------------------------------------------------------------------
# Mypy: tipado estático para el contrato entre repos.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "g360_core.common",
    "g360_core.normalizer",
    "g360_core.field_keywords",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_return_any = true
no_implicit_optional = true

[tool.uv.sources]
g360-core = { path = "../g360-cli/py" }
